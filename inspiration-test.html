<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inspiration · test</title>
<style>
  :root { --bg:#f4f2ee; --surface:#fff; --fg:#1c1b19; --muted:#6d6a63; --line:#e2ded6; --accent:#e8662a; --accent-ink:#fff; --chip:#ebe8e1; --good:#2f7d4f;
          --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0b0c; --surface:#1c1c1e; --fg:#f2f1ee; --muted:#9a9893; --line:#262628; --accent:#f07a3e; --accent-ink:#1a0f08; --chip:#1f1f21; --good:#5fbf86; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 var(--font); padding:calc(16px + env(safe-area-inset-top)) 16px 48px; }
  .wrap { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:4px 0 14px; }
  button { font:inherit; font-size:14px; padding:7px 13px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--fg); cursor:pointer; }
  button.share { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.on { background:var(--good); border-color:var(--good); color:#fff; }

  .top { position:sticky; top:0; z-index:5; background:var(--bg); margin:0 -16px; padding:calc(8px + env(safe-area-inset-top)) 16px 8px; border-bottom:1px solid var(--line); }
  body { padding-top:0 !important; }
  /* list */
  .item { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:0; }
  .th { position:relative; flex:0 0 46%; aspect-ratio:16/10; border-radius:12px; overflow:hidden; background:#000; }
  .th img { width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block; }
  .badge { position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.72); color:#fff; font-size:13px; font-weight:600; padding:2px 8px; border-radius:7px; }
  .seen { position:absolute; left:8px; top:8px; background:var(--good); color:#fff; font-size:12px; font-weight:700; padding:2px 7px; border-radius:7px; }
  .info { flex:1; min-width:0; display:flex; flex-direction:column; }
  .ttl { font-weight:650; font-size:17px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .cat { color:var(--muted); margin:4px 0 10px; }
  .info .share { align-self:flex-start; margin-top:10px; }

  .chips[hidden] { display:none; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .seg { display:flex; gap:4px; padding:4px; background:var(--chip); border-radius:12px; margin:0 0 12px; }
  .seg button { flex:1; border:0; background:transparent; font-weight:600; padding:8px 0; border-radius:9px; color:var(--muted); }
  .seg button.on { background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .chip { flex:0 0 auto; font-size:14px; padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--fg); cursor:pointer; white-space:nowrap; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .bar { display:flex; align-items:center; justify-content:space-between; margin:0 0 4px; }
  .count { color:var(--muted); font-size:13px; }
  button.sent { background:var(--chip); border-color:var(--line); color:var(--muted); }
  .when { color:var(--muted); font-size:13px; margin-top:4px; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
  .who { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .who button { color:var(--muted); }
  .who button.on { background:var(--good); border-color:var(--good); color:#fff; }
  .dots { position:absolute; left:8px; top:8px; display:flex; gap:4px; }
  .dots span { background:var(--good); color:#fff; font-size:11px; font-weight:700; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .wf { display:flex; gap:8px; margin:0 0 10px; }
  .wf button { font-size:13px; padding:5px 11px; border-radius:999px; color:var(--muted); }
  .wf button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .item.dim { opacity:.35; filter:grayscale(1); }
  /* player */
  #player[hidden], #list[hidden] { display:none; }
  .back { margin-bottom:14px; }
  .stage { width:100%; aspect-ratio:9/16; max-height:72vh; background:#000; border-radius:14px; overflow:hidden; }
  .stage video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
  .p-ttl { font-weight:650; font-size:18px; margin:14px 0 2px; }
  .p-desc { color:var(--muted); margin:4px 0 14px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:9; }
  .sheet[hidden] { display:none; }
  .sheet .box { background:var(--surface); width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:17px; margin:0 0 4px; }
  .sheet p { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .sheet input { width:100%; font:inherit; font-size:17px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); margin-bottom:12px; }
  .link { background:none; border:0; color:var(--muted); font-size:13px; padding:16px 0 0; text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <section id="list">
    <div class="top">
    <h1>Inspiration</h1>
    <div class="seg" id="seg"><button data-p="Discover">Discover</button><button data-p="Shared">Shared</button></div>
    <div class="chips" id="chips"></div>
    <div class="wf" id="wf"></div>
    <div class="bar"><span class="count" id="count"></span><button id="rnd">🎲 Random</button></div>
    </div>
    <div id="items"></div>
    <button class="link" id="chg">Change Chrissi's number</button>
  </section>
  <section id="player" hidden>
    <button class="back" id="back">‹ Back</button>
    <div class="stage"><video id="v" playsinline controls preload="metadata"></video></div>
    <div class="p-ttl" id="pt"></div>
    <p class="p-desc" id="pd"></p>
    <div class="who" id="who"></div>
    <div class="btns"><button class="share" id="ps"></button></div>
  </section>
</div>
<div class="sheet" id="sheet" hidden><div class="box">
  <h2>Chrissi's WhatsApp number</h2>
  <p>With country code, e.g. +49 151 2345678. Saved only on this device — never in the launcher's code.</p>
  <input id="num" type="tel" inputmode="tel" autocomplete="off" placeholder="+49 …">
  <div class="btns"><button class="share" id="save">Save</button><button id="cancel">Cancel</button></div>
</div></div>
<script>
  let VIDEOS = [];
  const ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  const $ = id => document.getElementById(id);
  const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const mmss = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
  const watched = id => { try { return localStorage.getItem('insp-watched-'+id) === '1'; } catch { return false; } };
  const setWatched = (id, on) => { try { localStorage.setItem('insp-watched-'+id, on ? '1' : '0'); } catch {} };
  const WHO = [['me','Me','M'],['atlas','Atlas','A'],['chrissi','Chrissi','C']];
  const wKey = (w, id) => w === 'me' ? 'insp-watched-' + id : 'insp-w-' + w + '-' + id;
  const isW = (w, id) => { try { return localStorage.getItem(wKey(w, id)) === '1'; } catch { return false; } };
  const setW = (w, id, on) => { try { localStorage.setItem(wKey(w, id), on ? '1' : '0'); } catch {} };
  const EYE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', CHK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><path d="M5 12l5 5L20 7"/></svg>';

  const NKEY = 'insp-chrissi-wa';
  const getNum = () => { try { return localStorage.getItem(NKEY) || ''; } catch { return ''; } };
  let pending = null;
  function askNum(then) {
    pending = then; $('num').value = getNum() ? '+' + getNum() : ''; $('sheet').hidden = false; setTimeout(() => $('num').focus(), 50);
  }
  $('save').onclick = () => {
    let n = $('num').value.trim().replace(/^00/, '+');
    const digits = n.replace(/\D/g, '');
    if (!n.startsWith('+') || digits.length < 8) { $('num').style.borderColor = 'var(--accent)'; return; }
    try { localStorage.setItem(NKEY, digits); } catch {}
    $('sheet').hidden = true; const f = pending; pending = null; f && f();
  };
  $('cancel').onclick = () => { $('sheet').hidden = true; pending = null; };
  $('chg').onclick = () => askNum(null);
  const SKEY = 'insp-shared';
  const sharedMap = () => { try { return JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch { return {}; } };
  const markShared = id => { const m = sharedMap(); m[id] = new Date().toISOString(); try { localStorage.setItem(SKEY, JSON.stringify(m)); } catch {} };
  const shareBtn = x => sharedMap()[x.id] ? '✓ Sent' : ICON + 'Chrissi';
  function share(x) {
    const go = () => { markShared(x.id); renderList(); if (cur) paintS(); location.href = 'https://wa.me/' + getNum() + '?text=' + encodeURIComponent(x.title + '\n' + location.href.replace(/[^/]*$/, '') + 'insp/' + x.id + '.html'); };
    getNum() ? go() : askNum(go);
  }

  const CATS = [['All',null],['Atlas','Atlas Inspiration'],['Chrissi Resilience','Chrissi Resilience'],['Chrissi Education','Chrissi Education'],['Javi','Javi Inspiration']];
  const ls = (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } };
  let parent = ls('insp-parent', 'Discover'), filt = ls('insp-filter', 'All');
  if (!CATS.find(c => c[0] === filt)) filt = 'All';
  let wfilt = ls('insp-wfilter', '');
  const fmtDay = iso => new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  function visible() {
    const c = CATS.find(c => c[0] === filt) || CATS[0], sm = sharedMap();
    if (parent === 'Shared') return VIDEOS.filter(x => sm[x.id]).sort((a, b) => sm[b.id].localeCompare(sm[a.id]));
    return VIDEOS.filter(x => !c[1] || x.cat === c[1]).sort((a, b) => (b.added || '').localeCompare(a.added || ''));
  }
  function renderList() {
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.p === parent));
    $('chips').hidden = parent === 'Shared';
    $('wf').innerHTML = WHO.map(w => `<button class="${wfilt === w[0] ? 'on' : ''}" data-wf="${w[0]}">${EYE}${w[1]}</button>`).join('');
    $('chips').innerHTML = CATS.map(c => `<button class="chip ${c[0] === filt ? 'on' : ''}" data-f="${c[0]}">${c[0]}</button>`).join('');
    const list = visible(), sm = sharedMap(), isShared = parent === 'Shared';
    $('count').textContent = list.length + (list.length === 1 ? ' video' : ' videos');
    $('rnd').hidden = isShared;
    $('items').innerHTML = list.length ? list.map(x => `
      <div class="item ${wfilt && isW(wfilt, x.id) ? 'dim' : ''}" data-id="${x.id}">
        <div class="th"><img src="covers/insp/${x.id}.jpg" alt="" loading="lazy">
          ${(() => { const d = WHO.filter(w => isW(w[0], x.id)).map(w => `<span>${w[2]}</span>`).join(''); return d ? `<span class="dots">${d}</span>` : ''; })()}<span class="badge">${mmss(x.dur)}</span></div>
        <div class="info"><div class="ttl">${esc(x.title)}</div>
          ${isShared ? `<div class="when">Sent ${fmtDay(sm[x.id])}</div>` : ''}
          <button class="share ${sm[x.id] ? 'sent' : ''}" data-share="${x.id}">${shareBtn(x)}</button></div>
      </div>`).join('') : `<div class="empty">${isShared ? 'Nothing shared with Chrissi yet.' : 'No videos here yet.'}</div>`;
  }
  $('seg').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (!b) return; parent = b.dataset.p; try { localStorage.setItem('insp-parent', parent); } catch {} renderList(); });
  $('wf').addEventListener('click', e => { const b = e.target.closest('[data-wf]'); if (!b) return; wfilt = wfilt === b.dataset.wf ? '' : b.dataset.wf; try { localStorage.setItem('insp-wfilter', wfilt); } catch {} renderList(); });
  $('chips').addEventListener('click', e => { const c = e.target.closest('[data-f]'); if (!c) return; filt = c.dataset.f; try { localStorage.setItem('insp-filter', filt); } catch {} renderList(); });
  $('rnd').onclick = () => { const sm = sharedMap(), l = visible().filter(x => !(wfilt && isW(wfilt, x.id))), pool = l.filter(x => !sm[x.id]).length ? l.filter(x => !sm[x.id]) : l; if (pool.length) location.hash = 'v=' + pool[Math.floor(Math.random() * pool.length)].id; };

  $('items').addEventListener('click', e => {
    const s = e.target.closest('[data-share]');
    if (s) { e.stopPropagation(); return share(VIDEOS.find(x => x.id === s.dataset.share)); }
    const it = e.target.closest('.item'); if (it) { listY = scrollY; try { sessionStorage.setItem('insp-y', listY); } catch {} location.hash = 'v=' + it.dataset.id; }
  });

  let cur = null;
  let listY = (() => { try { return +sessionStorage.getItem('insp-y') || 0; } catch { return 0; } })();
  const paintW = () => { $('who').innerHTML = WHO.map(w => { const on = isW(w[0], cur.id); return `<button class="${on ? 'on' : ''}" data-w="${w[0]}">${on ? CHK : EYE}${w[1]}</button>`; }).join(''); };
  $('who').addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; setW(b.dataset.w, cur.id, !isW(b.dataset.w, cur.id)); paintW(); });
  const paintS = () => { const on = !!sharedMap()[cur.id]; $('ps').innerHTML = shareBtn(cur); $('ps').classList.toggle('sent', on); };
  $('ps').onclick = () => share(cur);
  $('back').onclick = () => { location.hash = ''; };
  $('v').addEventListener('ended', () => { setWatched(cur.id, true); paintW(); });

  function route() {
    const id = (location.hash.match(/v=([\w-]+)/) || [])[1];
    cur = VIDEOS.find(x => x.id === id) || null;
    const v = $('v');
    if (!cur) { v.pause(); v.removeAttribute('src'); v.load(); $('player').hidden = true; $('list').hidden = false; renderList(); requestAnimationFrame(() => scrollTo(0, listY)); return; }
    $('pt').textContent = cur.title; $('pd').textContent = cur.desc || '';
    v.poster = `covers/insp/${cur.id}.jpg`; v.src = cur.link + '&raw=1';
    paintW(); paintS(); $('list').hidden = true; $('player').hidden = false; scrollTo(0, 0);
    v.play().catch(() => {});
  }
  addEventListener('hashchange', route);
  fetch('data/inspiration.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { VIDEOS = d; route(); });
</script>
</body>
</html>
