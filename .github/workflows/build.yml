name: Build library

on:
  push:
    paths: ["data/library.txt", "data/overrides.json", "scripts/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "17 * * * *"   # hourly: picks up new Trakt watches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Match titles and read watched status
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "launcher-bot"
          git config user.email "launcher-bot@users.noreply.github.com"
          git add library.json data/matches.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update library"
          git pull --rebase origin main
          git push
