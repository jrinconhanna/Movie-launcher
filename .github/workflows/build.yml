name: Build library

on:
  push:
    paths: ["data/library.txt", "data/overrides.json", "data/courses.json", "scripts/**", ".github/workflows/build.yml"]
  schedule:
    - cron: "17 * * * *"   # hourly: picks up new Trakt watches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-library
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tech file list and covers from Whatbox (V2.4)
        continue-on-error: true   # if Whatbox is down, the rest still builds with the last list
        env:
          KEY: ${{ secrets.WHATBOX_SSH_KEY }}
        run: |
          test -n "$KEY" || { echo "No Whatbox key"; exit 0; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/whatbox && chmod 600 ~/.ssh/whatbox
          ssh-keyscan -H kiwi.whatbox.ca >> ~/.ssh/known_hosts 2>/dev/null
          pip install -q pillow
          python scripts/tech_sync.py
          rm -f ~/.ssh/whatbox
      - name: Match titles and read watched status
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: python scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "launcher-bot"
          git config user.email "launcher-bot@users.noreply.github.com"
          git add library.json data/matches.json data/suggestions.json data/epcounts.json data/tech-files.txt
          git add covers/t 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update library"
          git pull --rebase origin main
          git push
