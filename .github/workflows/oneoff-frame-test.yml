name: One-off - frame test (Reforge W1 at 3 s, nothing changed on Whatbox)
on:
  push:
    paths: [".github/workflows/oneoff-frame-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          KEY: ${{ secrets.WHATBOX_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/whatbox && chmod 600 ~/.ssh/whatbox
          ssh-keyscan -H kiwi.whatbox.ca >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i $HOME/.ssh/whatbox -o BatchMode=yes -o ConnectTimeout=20 javierrincon@kiwi.whatbox.ca"
          $S 'set -e; D="files/Javi/1- Tech/4- Reforge/1- AI Strategy/Week 1 - The Strategic Landscape"; mkdir -p /tmp/ft; rm -f /tmp/ft/*
            i=0; for F in "$D"/*.mp4; do i=$((i+1)); ffmpeg -v error -y -ss 3 -i "$F" -frames:v 1 -vf scale=480:-2 -q:v 4 "/tmp/ft/w1_$(printf %02d $i).jpg"; echo "$i $(basename "$F")"; done'
          mkdir -p data/ft && scp -i ~/.ssh/whatbox -o BatchMode=yes "javierrincon@kiwi.whatbox.ca:/tmp/ft/*.jpg" data/ft/
          $S 'rm -rf /tmp/ft'
          rm -f ~/.ssh/whatbox
          git config user.name "launcher-bot"; git config user.email "launcher-bot@users.noreply.github.com"
          git add data/ft && git commit -m "Frame test: Reforge W1 at 3 s" && git pull --rebase origin main && git push
