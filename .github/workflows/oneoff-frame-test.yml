name: One-off - frame test (1/3/5/10 s on three videos, nothing changed on Whatbox)
on:
  push:
    paths: [".github/workflows/oneoff-frame-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          KEY: ${{ secrets.WHATBOX_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/whatbox && chmod 600 ~/.ssh/whatbox
          ssh-keyscan -H kiwi.whatbox.ca >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i $HOME/.ssh/whatbox -o BatchMode=yes -o ConnectTimeout=20 javierrincon@kiwi.whatbox.ca"
          $S 'set -e; B="files/Javi/1- Tech"; mkdir -p /tmp/ft; rm -f /tmp/ft/*
            i=0
            for F in "5- Playlists/2026-08 - Peter Thiel/Peter Thiel - Cambridge Union.mp4" \
                     "4- Reforge/1- AI Strategy/Week 1 - The Strategic Landscape/1a - AI Tech Shift - How AI Is Creating More Red Ocean vs Blue Ocean.mp4" \
                     "5- Playlists/2026-08 - Kanye West/2004 - Kanye West First 106 & Park Interview.mp4"; do
              i=$((i+1)); for T in 1 3 5 10; do ffmpeg -v error -y -ss $T -i "$B/$F" -frames:v 1 -vf scale=480:-2 -q:v 4 /tmp/ft/v${i}_${T}.jpg; done; done
            ls /tmp/ft'
          mkdir -p data/ft && scp -i ~/.ssh/whatbox -o BatchMode=yes "javierrincon@kiwi.whatbox.ca:/tmp/ft/*.jpg" data/ft/
          $S 'rm -rf /tmp/ft'
          rm -f ~/.ssh/whatbox
          git config user.name "launcher-bot"; git config user.email "launcher-bot@users.noreply.github.com"
          git add data/ft && git commit -m "Frame test 1/3/5/10 s" && git pull --rebase origin main && git push
