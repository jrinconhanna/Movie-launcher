name: Whatbox fix (one-off, Steve Jobs files)

# One-off: runs the renames/deletes listed in data/whatbox-ops.txt on Whatbox,
# only inside files/Javi/1- Tech/1- Steve Jobs, never overwriting (mv -n),
# and writes before/after listings to data/whatbox-ops-log.txt. Deleted after use.

on:
  push:
    paths:
      - data/whatbox-ops.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up the key
        env:
          KEY: ${{ secrets.WHATBOX_SSH_KEY }}
        run: |
          test -n "$KEY" || { echo "Secret WHATBOX_SSH_KEY is missing"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/whatbox && chmod 600 ~/.ssh/whatbox
          ssh-keyscan -H kiwi.whatbox.ca >> ~/.ssh/known_hosts 2>/dev/null
      - name: Run the ops
        run: |
          cat > /tmp/remote.sh <<'SH'
          set -u
          cd "$HOME/files/Javi/1- Tech/1- Steve Jobs" || { echo "NO FOLDER"; exit 1; }
          echo "Run: $(date -u '+%Y-%m-%d %H:%M UTC')"
          while IFS=$'\t' read -r op a b; do
            [ -z "$op" ] && continue
            case "$a$b" in *..*|/*) echo "SKIP unsafe: $a $b"; continue;; esac
            if [ "$op" = mv ]; then
              if [ ! -e "$a" ]; then echo "MISSING $a"; elif [ -e "$b" ]; then echo "TARGET EXISTS $b"; else mv -n -- "$a" "$b" && echo "OK mv $a -> $b ($(stat -c %s -- "$b") bytes)"; fi
            elif [ "$op" = rm ]; then
              if [ ! -f "$a" ]; then echo "MISSING $a"; else s=$(stat -c %s -- "$a"); rm -- "$a" && echo "OK rm $a ($s bytes)"; fi
            fi
          done
          echo "--- after:"
          find . -type f \( -name '*Macworld Boston*' -o -name '*Staff*' -o -name '*Apple Expo*2000*' -o -name '*Apple Expo Paris*' -o -name '*Unabridged*' -o -name '*Smithsonian*' \) -printf '%s %p\n' | sort -k2
          SH
          B64=$(base64 -w0 /tmp/remote.sh)
          ssh -i ~/.ssh/whatbox -o BatchMode=yes -o ConnectTimeout=20 javierrincon@kiwi.whatbox.ca "echo $B64 | base64 -d > /tmp/sjfix.sh"
          ssh -i ~/.ssh/whatbox -o BatchMode=yes -o ConnectTimeout=20 javierrincon@kiwi.whatbox.ca 'bash /tmp/sjfix.sh; rm -f /tmp/sjfix.sh' < data/whatbox-ops.txt > data/whatbox-ops-log.txt 2>&1
          cat data/whatbox-ops-log.txt
      - name: Save
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add data/whatbox-ops-log.txt
          git commit -m "Whatbox fix log" || exit 0
          git pull --rebase -q && git push
