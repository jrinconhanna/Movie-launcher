name: One-off - Backlog folders Michael Sugrue + Marc Andreessen (Javi's go, 11 Nov)
on:
  push:
    paths: [".github/workflows/oneoff-backlog-dirs.yml"]
permissions:
  contents: read
jobs:
  mk:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.WHATBOX_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/whatbox && chmod 600 ~/.ssh/whatbox
          ssh-keyscan -H kiwi.whatbox.ca >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/whatbox -o BatchMode=yes -o ConnectTimeout=20 javierrincon@kiwi.whatbox.ca '
            cd "files/Javi/1- Tech/5- Playlists/z - Backlog" && mkdir -p "z- Michael Sugrue" "z- Marc Andreessen" && echo DONE && ls'
          rm -f ~/.ssh/whatbox
