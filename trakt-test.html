<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trakt login test</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #777; margin: 0 0 20px; font-size: 13px; }
  button { font: inherit; padding: 8px 14px; margin: 0 6px 8px 0; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #log { margin-top: 16px; font: 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #f6f6f6; border-radius: 8px; padding: 12px; min-height: 60px; }
  .ok { color: #1a7f37; } .bad { color: #c62828; }
</style>
</head>
<body>
<h1>Trakt login test</h1>
<p class="sub">Hidden test page. No secret here. The login stays in this browser only.</p>
<div>
  <button id="login">1 · Log in</button>
  <button id="paused" disabled>2 · Read paused movies</button>
  <button id="write" disabled>3 · Add + remove a test item</button>
  <button id="logout" disabled>4 · Log out</button>
  <button id="renew" disabled>5 · Renew login (no secret)</button>
</div>
<div id="log"></div>
<script>
(function () {
  var CLIENT_ID = '8JCox_SeBb82A1WgJW48P67jldMz2aiSZ-xOZ7qH67g';
  var API = 'https://api.trakt.tv';
  var TEST_MOVIE = { ids: { tmdb: 196 } }; // Back to the Future Part III
  var $ = function (id) { return document.getElementById(id); };
  function log(msg, cls) { var d = document.createElement('div'); if (cls) d.className = cls; d.textContent = msg; $('log').appendChild(d); }
  function token() { try { return JSON.parse(localStorage.getItem('trakt-test-token') || 'null'); } catch (e) { return null; } }
  function setUI() { var t = !!token(); $('paused').disabled = $('write').disabled = $('logout').disabled = $('renew').disabled = !t; $('login').disabled = t; }
  function api(path, opts) {
    opts = opts || {};
    var h = { 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': CLIENT_ID };
    var t = token(); if (t) h.Authorization = 'Bearer ' + t.access_token;
    return fetch(API + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  }

  $('login').onclick = async function () {
    log('Asking Trakt for a code…');
    try {
      var r = await fetch(API + '/oauth/device/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: CLIENT_ID }) });
      if (!r.ok) { log('✗ Trakt said ' + r.status + ': ' + (await r.text()).slice(0, 200), 'bad'); return; }
      var dc = await r.json();
      var box = document.createElement('div'); box.style.cssText = 'font-size:22px;margin:8px 0';
      box.innerHTML = 'Go to <a href="' + dc.verification_url + '" target="_blank">' + dc.verification_url.replace('https://', '') + '</a> and type <b>' + dc.user_code + '</b>';
      $('log').appendChild(box);
      log('Waiting for you to approve…');
      var until = Date.now() + dc.expires_in * 1000;
      var poll = async function () {
        if (Date.now() > until) { log('✗ Code expired. Press Log in again.', 'bad'); return; }
        var t = await fetch(API + '/oauth/device/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: dc.device_code, client_id: CLIENT_ID }) });
        if (t.status === 200) { localStorage.setItem('trakt-test-token', await t.text()); log('✓ Logged in with no secret on the page.', 'ok'); setUI(); return; }
        if (t.status === 400) { setTimeout(poll, dc.interval * 1000); return; }
        if (t.status === 429) { setTimeout(poll, (dc.interval + 2) * 1000); return; }
        log('✗ Trakt said ' + t.status + ': ' + (await t.text()).slice(0, 200), 'bad');
        if (t.status === 401 || t.status === 403) log('→ Trakt needs the secret. Plan B: a tiny Cloudflare Worker holds it.');
      };
      setTimeout(poll, dc.interval * 1000);
    } catch (e) { log('✗ The browser blocked the request (' + e.message + '). Plan B: Cloudflare Worker.', 'bad'); }
  };

  $('paused').onclick = async function () {
    var r = await api('/sync/playback/movies');
    if (!r.ok) { log('✗ Read failed: ' + r.status, 'bad'); return; }
    var list = await r.json();
    log('✓ ' + list.length + ' paused movie(s)' + (list.length ? ': ' + list.slice(0, 5).map(function (x) { return x.movie.title + ' ' + Math.round(x.progress) + '%'; }).join(', ') : ''), 'ok');
  };

  $('write').onclick = async function () {
    var a = await api('/sync/watchlist', { method: 'POST', body: { movies: [TEST_MOVIE] } });
    if (!a.ok) { log('✗ Add failed: ' + a.status, 'bad'); return; }
    log('✓ Added a test movie to your Trakt Watchlist.', 'ok');
    var d = await api('/sync/watchlist/remove', { method: 'POST', body: { movies: [TEST_MOVIE] } });
    log(d.ok ? '✓ Removed it again. Writing works.' : '✗ Remove failed: ' + d.status + ' (remove it by hand in Trakt)', d.ok ? 'ok' : 'bad');
  };

  function left(t) { var s = (t.created_at + t.expires_in) - Date.now() / 1000; return s < 0 ? 'expired' : s > 172800 ? Math.round(s / 86400) + ' days left' : Math.round(s / 3600) + ' h left'; }
  $('renew').onclick = async function () {
    var t = token(); log('Current login: ' + left(t) + ' (lasts ' + Math.round(t.expires_in / 3600) + ' h).');
    try {
      var r = await fetch(API + '/oauth/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: t.refresh_token, client_id: CLIENT_ID, redirect_uri: 'urn:ietf:wg:oauth:2.0:oob', grant_type: 'refresh_token' }) });
      if (r.ok) { var n = await r.json(); localStorage.setItem('trakt-test-token', JSON.stringify(n)); log('✓ Renewed with no secret. New login: ' + left(n) + '. Stays logged in for good.', 'ok'); return; }
      log('✗ Trakt said ' + r.status + ': ' + (await r.text()).slice(0, 200), 'bad');
      log('→ Renewing needs the secret. Plan B: a tiny Cloudflare Worker renews the login (the secret stays there).');
    } catch (e) { log('✗ The browser blocked the request (' + e.message + '). Plan B: Cloudflare Worker.', 'bad'); }
  };

  $('logout').onclick = function () { localStorage.removeItem('trakt-test-token'); log('Logged out on this device.'); setUI(); };

  setUI();
  if (token()) log('Already logged in on this device · ' + left(token()) + '.');
})();
</script>
</body>
</html>
