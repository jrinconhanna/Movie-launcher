<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trakt login test</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #777; margin: 0 0 20px; font-size: 13px; }
  button { font: inherit; padding: 8px 14px; margin: 0 6px 8px 0; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #log { margin-top: 16px; font: 13px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #f6f6f6; border-radius: 8px; padding: 12px; min-height: 60px; }
  .ok { color: #1a7f37; } .bad { color: #c62828; }
</style>
</head>
<body>
<h1>Trakt login test</h1>
<p class="sub">Hidden test page. No secret here. The login stays in this browser only.</p>
<div>
  <button id="login">1 · Log in</button>
  <button id="paused" disabled>2 · Read paused movies</button>
  <button id="write" disabled>3 · Add + remove a test item</button>
  <button id="logout" disabled>4 · Log out</button>
  <button id="renew" disabled>5 · Renew login (no secret)</button>
  <button id="v22">6 · V2.2 check: speed + my ratings</button>
  <button id="v23">7 · V2.3 check: copy a title + open Infuse</button>
</div>
<div id="wb" style="margin-top:14px;padding:10px;border:1px solid #ddd;border-radius:8px;max-width:640px">
  <b>8 · V2.3 check: play straight away from Whatbox</b>
  <p class="sub" style="margin:4px 0 8px">Saved only in this browser on this device. Never sent to GitHub or to Claude. Don't paste your password into the chat.</p>
  <label>Share address, as in Infuse (folder that holds “1- Tech”)<br><input id="wbBase" style="width:100%" placeholder="https://yourserver.whatbox.ca/webdav/files" autocapitalize="off" autocorrect="off" spellcheck="false"></label><br>
  <label>Username<br><input id="wbUser" style="width:100%" autocapitalize="off" autocorrect="off" spellcheck="false"></label><br>
  <label>Password<br><input id="wbPass" type="password" style="width:100%"></label><br>
  <label>Video (path inside that folder)<br><input id="wbPath" style="width:100%" autocapitalize="off" autocorrect="off" spellcheck="false" value="1- Tech/2- TOC/1- GSP Series/2. Finance and Measurements - T, I &amp; OE and Throughput Accounting.mp4"></label><br>
  <button id="wbSave">Save on this device</button>
  <button id="wbPlay">8 · Play in Infuse</button>
  <button id="wbForget">Forget</button>

</div>
<div id="log"></div>
<script>
(function () {
  var CLIENT_ID = '8JCox_SeBb82A1WgJW48P67jldMz2aiSZ-xOZ7qH67g';
  var API = 'https://api.trakt.tv';
  var TEST_MOVIE = { ids: { tmdb: 196 } }; // Back to the Future Part III
  var $ = function (id) { return document.getElementById(id); };
  function log(msg, cls) { var d = document.createElement('div'); if (cls) d.className = cls; d.textContent = msg; $('log').appendChild(d); }
  function token() { try { return JSON.parse(localStorage.getItem('trakt-test-token') || 'null'); } catch (e) { return null; } }
  function setUI() { var t = !!token(); $('paused').disabled = $('write').disabled = $('logout').disabled = $('renew').disabled = !t; $('login').disabled = t; }
  function api(path, opts) {
    opts = opts || {};
    var h = { 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': CLIENT_ID };
    var t = token(); if (t) h.Authorization = 'Bearer ' + t.access_token;
    return fetch(API + path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  }

  $('login').onclick = async function () {
    log('Asking Trakt for a code…');
    try {
      var r = await fetch(API + '/oauth/device/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ client_id: CLIENT_ID }) });
      if (!r.ok) { log('✗ Trakt said ' + r.status + ': ' + (await r.text()).slice(0, 200), 'bad'); return; }
      var dc = await r.json();
      var box = document.createElement('div'); box.style.cssText = 'font-size:22px;margin:8px 0';
      box.innerHTML = 'Go to <a href="' + dc.verification_url + '" target="_blank">' + dc.verification_url.replace('https://', '') + '</a> and type <b>' + dc.user_code + '</b>';
      $('log').appendChild(box);
      log('Waiting for you to approve…');
      var until = Date.now() + dc.expires_in * 1000;
      var poll = async function () {
        if (Date.now() > until) { log('✗ Code expired. Press Log in again.', 'bad'); return; }
        var t = await fetch(API + '/oauth/device/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: dc.device_code, client_id: CLIENT_ID }) });
        if (t.status === 200) { localStorage.setItem('trakt-test-token', await t.text()); log('✓ Logged in with no secret on the page.', 'ok'); setUI(); return; }
        if (t.status === 400) { setTimeout(poll, dc.interval * 1000); return; }
        if (t.status === 429) { setTimeout(poll, (dc.interval + 2) * 1000); return; }
        log('✗ Trakt said ' + t.status + ': ' + (await t.text()).slice(0, 200), 'bad');
        if (t.status === 401 || t.status === 403) log('→ Trakt needs the secret. Plan B: a tiny Cloudflare Worker holds it.');
      };
      setTimeout(poll, dc.interval * 1000);
    } catch (e) { log('✗ The browser blocked the request (' + e.message + '). Plan B: Cloudflare Worker.', 'bad'); }
  };

  $('paused').onclick = async function () {
    var r = await api('/sync/playback/movies');
    if (!r.ok) { log('✗ Read failed: ' + r.status, 'bad'); return; }
    var list = await r.json();
    log('✓ ' + list.length + ' paused movie(s)' + (list.length ? ': ' + list.slice(0, 5).map(function (x) { return x.movie.title + ' ' + Math.round(x.progress) + '%'; }).join(', ') : ''), 'ok');
  };

  $('write').onclick = async function () {
    var a = await api('/sync/watchlist', { method: 'POST', body: { movies: [TEST_MOVIE] } });
    if (!a.ok) { log('✗ Add failed: ' + a.status, 'bad'); return; }
    log('✓ Added a test movie to your Trakt Watchlist.', 'ok');
    var d = await api('/sync/watchlist/remove', { method: 'POST', body: { movies: [TEST_MOVIE] } });
    log(d.ok ? '✓ Removed it again. Writing works.' : '✗ Remove failed: ' + d.status + ' (remove it by hand in Trakt)', d.ok ? 'ok' : 'bad');
  };

  function left(t) { var s = (t.created_at + t.expires_in) - Date.now() / 1000; return s < 0 ? 'expired' : s > 172800 ? Math.round(s / 86400) + ' days left' : Math.round(s / 3600) + ' h left'; }
  $('renew').onclick = async function () {
    var t = token(); log('Current login: ' + left(t) + ' (lasts ' + Math.round(t.expires_in / 3600) + ' h).');
    try {
      var r = await fetch(API + '/oauth/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: t.refresh_token, client_id: CLIENT_ID, redirect_uri: 'urn:ietf:wg:oauth:2.0:oob', grant_type: 'refresh_token' }) });
      if (r.ok) { var n = await r.json(); localStorage.setItem('trakt-test-token', JSON.stringify(n)); log('✓ Renewed with no secret. New login: ' + left(n) + '. Stays logged in for good.', 'ok'); return; }
      log('✗ Trakt said ' + r.status + ': ' + (await r.text()).slice(0, 200), 'bad');
      log('→ Renewing needs the secret. Plan B: a tiny Cloudflare Worker renews the login (the secret stays there).');
    } catch (e) { log('✗ The browser blocked the request (' + e.message + '). Plan B: Cloudflare Worker.', 'bad'); }
  };

  // 6 · V2.2 risks: how long reading watched status takes on this device, and whether Infuse ratings reach Trakt
  function anyToken() { var keys = ['trakt-token', 'trakt-test-token']; for (var i = 0; i < keys.length; i++) { try { var v = JSON.parse(localStorage.getItem(keys[i]) || 'null'); if (typeof v === 'string') v = JSON.parse(v); if (v && v.access_token) return v; } catch (e) {} } return null; }
  async function timed(path, t) { var t0 = performance.now(); var r = await fetch(API + path, { headers: { 'Content-Type': 'application/json', 'trakt-api-version': '2', 'trakt-api-key': CLIENT_ID, Authorization: 'Bearer ' + t.access_token } }); var txt = await r.text(); return { ok: r.ok, status: r.status, ms: Math.round(performance.now() - t0), kb: Math.round(txt.length / 1024), json: r.ok ? JSON.parse(txt) : null }; }
  $('v22').onclick = async function () {
    var t = anyToken(); if (!t) { log('✗ Not logged in on this device. Connect Trakt in the launcher first (or step 1 here).', 'bad'); return; }
    log('V2.2 check on this device…');
    try {
      var a = await timed('/sync/last_activities', t); log((a.ok ? '✓' : '✗') + ' What changed (last activities): ' + a.ms + ' ms, ' + a.kb + ' KB', a.ok ? 'ok' : 'bad');
      var m = await timed('/sync/watched/movies', t); log((m.ok ? '✓' : '✗') + ' Watched movies: ' + (m.json ? m.json.length : '?') + ' in ' + m.ms + ' ms, ' + m.kb + ' KB', m.ok ? 'ok' : 'bad');
      var sh = await timed('/sync/watched/shows', t); log((sh.ok ? '✓' : '✗') + ' Watched series (with episodes): ' + (sh.json ? sh.json.length : '?') + ' in ' + sh.ms + ' ms, ' + sh.kb + ' KB', sh.ok ? 'ok' : 'bad');
      log('→ Total on open if something changed: ~' + (a.ms + m.ms + sh.ms) + ' ms. If nothing changed: ~' + a.ms + ' ms.');
      var rt = await timed('/sync/ratings/movies', t);
      if (!rt.ok) { log('✗ Ratings read failed: ' + rt.status, 'bad'); }
      else if (!rt.json.length) { log('✗ No movie ratings on Trakt yet. Rate one movie in Infuse, wait a minute, then press 6 again.', 'bad'); }
      else { var last = rt.json.slice().sort(function (x, y) { return y.rated_at < x.rated_at ? -1 : 1; }).slice(0, 3); log('✓ ' + rt.json.length + ' movie rating(s) on Trakt. Latest: ' + last.map(function (x) { return x.movie.title + ' ★' + x.rating + ' (' + x.rated_at.slice(0, 10) + ')'; }).join(', '), 'ok'); log('→ If the movie you just rated in Infuse is in that list, Infuse sends ratings to Trakt.'); }
    } catch (e) { log('✗ ' + e.message, 'bad'); }
  };

  // 7 · V2.3: Infuse links can't open its search, so: copy the title, open Infuse, paste in search.
  var V23_TITLE = 'Finance and Measurements - T, I & OE and Throughput Accounting';
  function copyText(t) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(function () { return 'clipboard'; }, function () { return fallbackCopy(t); });
    return Promise.resolve(fallbackCopy(t));
  }
  function fallbackCopy(t) { var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok ? 'fallback' : 'failed'; }
  $('v23').onclick = function () {
    copyText(V23_TITLE).then(function (how) {
      if (how === 'failed') { log('✗ Could not copy the title on this device.', 'bad'); return; }
      log('✓ Copied (' + how + '): ' + V23_TITLE, 'ok');
      log('→ Infuse should open now. Tap Search, paste, and check the video shows up. Then come back and tell Claude.');
      setTimeout(function () { location.href = 'infuse://'; }, 250);
    });
  };

  // 8 · V2.3: play a video straight away: infuse://x-callback-url/play?url=<file on Whatbox>
  var WB = 'whatbox-play';
  function wbGet() { try { return JSON.parse(localStorage.getItem(WB) || 'null'); } catch (e) { return null; } }
  function wbFill() { var w = wbGet(); if (!w) return; $('wbBase').value = w.base || ''; $('wbUser').value = w.user || ''; $('wbPass').value = w.pass ? '********' : ''; if (w.path) $('wbPath').value = w.path; }
  function wbRead() { var w = wbGet() || {}, p = $('wbPass').value; return { base: $('wbBase').value.trim().replace(/\/+$/, ''), user: $('wbUser').value.trim(), pass: p === '********' ? w.pass : p, path: $('wbPath').value.trim().replace(/^\.?\/+/, '') }; }
  function wbUrl(w, hide) {
    var m = /^(https?:\/\/)([^\/]+)(.*)$/.exec(w.base); if (!m) return null;
    var cred = w.user ? encodeURIComponent(w.user) + ':' + (hide ? '•••' : encodeURIComponent(w.pass || '')) + '@' : '';
    return m[1] + cred + m[2] + m[3] + '/' + w.path.split('/').map(encodeURIComponent).join('/');
  }
  $('wbSave').onclick = function () { var w = wbRead(); if (!/^https?:\/\//.test(w.base)) { log('✗ The share address must start with https://', 'bad'); return; } localStorage.setItem(WB, JSON.stringify(w)); wbFill(); log('✓ Saved on this device only.', 'ok'); };
  $('wbForget').onclick = function () { localStorage.removeItem(WB); $('wbBase').value = $('wbUser').value = $('wbPass').value = ''; log('Forgotten on this device.'); };
  $('wbPlay').onclick = function () {
    var w = wbRead(); if (!/^https?:\/\//.test(w.base)) { log('✗ Fill in the share address first (https://…).', 'bad'); return; }
    if (!wbGet()) localStorage.setItem(WB, JSON.stringify(w));
    var url = wbUrl(w), name = w.path.split('/').pop();
    log('Opening in Infuse: ' + wbUrl(w, true));
    log('→ Did it start playing? Tell Claude yes or no (and any error Infuse shows).');
    setTimeout(function () { location.href = 'infuse://x-callback-url/play?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(name); }, 250);
  };
  wbFill();

  $('logout').onclick = function () { localStorage.removeItem('trakt-test-token'); log('Logged out on this device.'); setUI(); };

  setUI();
  if (token()) log('Already logged in on this device · ' + left(token()) + '.');
})();
</script>
</body>
</html>
